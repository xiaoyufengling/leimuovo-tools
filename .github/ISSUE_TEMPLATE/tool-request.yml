name: 新工具建议
description: 提议一个小而明确的新工具
title: "[Tool] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述真实使用场景，不必先设计功能列表。
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 现在如何处理
      description: 说明当前步骤或替代工具。
  - type: dropdown
    id: local
    attributes:
      label: 是否涉及私人文件或数据
      options:
        - 是，应该本机处理
        - 否
        - 不确定
    validations:
      required: true
