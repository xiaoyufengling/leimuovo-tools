<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>没有访问权限｜小鱼控制中心</title>
    <link rel="stylesheet" href="../src/client/control.css" />
  </head>
  <body>
    <main class="control-main">
      <section class="control-state" aria-labelledby="denied-title">
        <div class="lm-state" data-state-variant="forbidden">
          <span class="lm-state__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><path d="M12 15v3"/></svg>
          </span>
          <p class="lm-state__eyebrow">权限不足</p>
          <h1 id="denied-title">当前身份无法访问。</h1>
          <p class="lm-state__description">当前访问身份未被允许，或外层访问验证尚未完成。请返回公开网站继续使用其他功能。</p>
          <div class="lm-state__actions">
            <a class="lm-button lm-button--primary" href="/">返回首页</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
